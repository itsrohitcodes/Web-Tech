<!-- Ordered List Contains a Nested Unordered List -->


<!DOCTYPE html>
<html>

<head>
    <title>Nested List Example</title>
</head>

<body>

    <!-- Ordered List -->
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3

            <!-- Unordered Nested List -->
            <ul>
                <li>Subitem 3.1</li>
                <li>Subitem 3.2</li>
            </ul>

        </li>
        <li>Item 4</li>
    </ol>

</body>

</html>
