<!-- Creating a Welcome Section with Preformatted Text -->


<!DOCTYPE html>
<html>

<head>
    <title>Div Containers Example</title>
</head>

<body>

    <!-- First Div Container -->
    <div>
        <h1>Welcome to My Website</h1>

        <pre>
This is preformatted text.
It retains whitespace and line breaks.
        </pre>
    </div>

    <!-- Second Div Container -->
    <div>
        <h1>About Us</h1>

        <p>
            We provide various services to our clients.
            Our team is dedicated to delivering quality solutions.
        </p>
    </div>

</body>

</html>
