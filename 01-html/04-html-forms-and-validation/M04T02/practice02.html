<!-- Time Input Field -->


<!DOCTYPE html>

<html>

<head>
    <title>Time Input Form</title>
</head>

<body>

    <h2>Time Input Example</h2>

    <form>

        <input type="time" id="time" name="time" required>

        <button type="submit">Submit</button>
    </form>

</body>

</html>
