<!-- Wrap HTML Input Tags -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Fields Example</title>
</head>

<body>

    <h2>Input Fields Example</h2>

    <form>

        <!-- Date Input Field -->
        <label for="date">Select a date:</label><br>
        <input type="date" id="date" name="date" required><br><br>

        <!-- Time Input Field -->
        <label for="time">Select a time:</label><br>
        <input type="time" id="time" name="time" required><br><br>

        <!-- URL Input Field -->
        <label for="website">Enter your website:</label><br>
        <input type="url" id="website" name="website" required><br><br>

        <button type="submit">Submit</button>

    </form>

</body>

</html>
