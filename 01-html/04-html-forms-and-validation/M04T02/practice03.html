<!-- URL Input Field -->


<!DOCTYPE html>

<html>

<head>
    <title>URL Input Form</title>
</head>

<body>

    <h2>URL Input Example</h2>

    <form>
        <label for="website">Enter your website:</label><br>

        <input type="url" id="website" name="website" required>

        <button type="submit">Submit</button>
    </form>

</body>

</html>
