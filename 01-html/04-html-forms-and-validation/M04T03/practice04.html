<!-- Range Input -->

<!DOCTYPE html>
<html>

<head>
    <title>Range Input Example</title>
</head>

<body>
    <h2>Set Volume</h2>
    <form>
        <label for="volume">Volume :</label>
        <input type="range" id="volume" name="volume" min="0" max="100" value="50">
        <br><br>
        <button type="submit">Submit</button>
    </form>
</body>

</html>
