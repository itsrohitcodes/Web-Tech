<!-- File Input -->

<!DOCTYPE html>
<html>

<head>
    <title>File Input Example</title>
</head>

<body>
    <h2>Upload Your File</h2>
    <form>
        <label for="fileUpload">Upload your file :</label>
        <input type="file" id="fileUpload" name="fileUpload" accept=".jpg, .png, .pdf">
        <br><br>
        <button type="submit">Submit</button>
    </form>
</body>

</html>
